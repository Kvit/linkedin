<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Contacts{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <nav><a href="/">Home</a><a href="/contacts">Contacts</a></nav>
    <form method="post" action="/refresh" class="inline">
      <span class="muted">data as of {{ built_at or "never" }}</span>
      <button type="submit" title="Reload every contact from Firestore (about 30 seconds)">Refresh</button>
    </form>
    <span class="muted user">{{ user }}</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
